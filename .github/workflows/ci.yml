name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # 支持手动触发

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'   # 缓存 Maven 依赖，加速 CI

      # 检查 Maven 版本，确认编译插件兼容 JDK 21
      - name: Show versions
        run: |
          java -version
          mvn -version

      # 全量测试（WireMock 本地 mock 后端，无需网络）
      - name: Run tests
        run: mvn -B test

      # 打包 fat-jar（验证 shade 插件与可执行 jar 可用）
      - name: Package
        run: mvn -B -DskipTests package

      - name: Verify jar exists
        run: ls -la target/webtest.jar

      # 上传测试报告与构建产物，方便在 GitHub 页面下载查看
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()   # 测试失败也上传，便于排查
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/webtest.jar
          retention-days: 7
